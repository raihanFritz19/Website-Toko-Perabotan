<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cahaya Perabotan</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: #050404;
            position: fixed;
            top: 0;
            bottom: 0;
            color: white;
        }
        .sidebar .header {
            background-color: #d50000;
            padding: 1px;
            text-align: center;
        }
        .sidebar .header h2 {
            margin: 0;
            font-size: 24px;
        }
        .sidebar .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }
        .sidebar .logo img {
            width: 100px;
            height: auto;
        }
        .sidebar a {
            display: block;
            color: white;
            padding: 16px;
            text-decoration: none;
        }
        .sidebar a:hover {
            background-color: #575757;
        }
        .main {
            margin-left: 250px;
            padding: 20px;
            padding-top: 90px; /* Add padding here. */
            flex: 1;
        }
        .top-bar {
            background-color: #333;
            color: white;
            padding: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 250px;
            right: 0;
            z-index: 1;
        }
        .top-bar .logout {
            background-color: #d50000;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            text-decoration: none;
            border-radius: 1px;
            margin-right: 40px; /* Move logout button to the left by 40px. */
        }
        .content h1 {
            color: red;
            text-align: left;
            padding: 0px;
            font-size: 36px;
            margin-bottom: 20px;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2); /* Box shadow updated */
        }
        .info-panel > div {
            width: 30%;
        }
        .info-panel h2 {
            font-size: 30px; /* Change font size to 18px */
            margin-bottom: 10px;
            color: red; /* Add red color here */
        }
        .info-panel p {
            margin: 5px 0;
        }
        .info-panel .underline {
            border-bottom: 1px solid black;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        .table-responsive {
            background-color: white;
            padding: 1px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 120px; /* Add margin-bottom here */
        }
        .qr-code {
            text-align: center;
            width: 30%; /* Set width to match other divs */
        }
        .form-group {
            margin-top: 10px;
        }
        .filter-form {
            display: flex;
            gap: 20px;
            margin-bottom: 0.1px;
            flex-wrap: wrap;
        }
        .filter-form input[type="date"] {
            width: 300px; /* Set width to 100px */
        }
        .filter-form input[type="text"], .filter-form select {
            width: 400px; /* Set width to 400px */
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="header">
            <h2>Cahaya<br>Perabotan</h2>
        </div>
        <div class="logo">
            <img src="https://via.placeholder.com/100" alt="Logo">
        </div>
        <a href="#">Home</a>
        <a href="#">Kategori</a>
        <a href="#">Produk</a>
        <a href="#">Penjualan</a>
        <a href="#">Laporan</a>
        <a href="#">Pelanggan</a>
        <a href="#">Logout</a>
    </div>

    <div class="top-bar">
        <h1></h1>
        <a href="#" class="logout">Logout</a>
    </div>

    <div class="main">
        <div class="content">
            <h1>Laporan Penjualan dari hingga</h1>
            <div class="filter-form">
                <div class="form-group">
                    <label for="start-date">Tanggal Mulai:</label>
                    <input type="date" id="start-date" name="start-date" class="form-control">
                </div>
                <div class="form-group">
                    <label for="end-date">Tanggal Selesai:</label>
                    <input type="date" id="end-date" name="end-date" class="form-control">
                </div>
                <div class="form-group">
                    <label for="status">Status:</label>
                    <select id="status" name="status" class="form-control">
                        <option>Pilih Status</option>
                    </select>
                </div>
                <div class="form-group d-flex align-items-end">
                    <button class="btn btn-primary">Lihat</button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Pelanggan</th>
                            <th>Tanggal</th>
                            <th>Jumlah</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="3">Total</td>
                            <td>Rp. 0</td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
